# Build Mondo-ready DOID OWL + LinkML YAML / OWL dump; publish release assets.
# Pipeline: download DOID OWL → ROBOT mirror → component (xref fix, property filter) →
# transform.py → validate → linkml-owl.
# See docs/plan.md. Stack: obolibrary/odkfull:v1.6 + linkml-owl==0.5.0 (via make dependencies).

name: Build and release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "config/**"
      - "sparql/**"
      - "linkml/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (ROBOT + LinkML)
        run: |
          docker run --rm \
            -e ROBOT_PLUGINS_DIRECTORY=/tools/robot-plugins \
            -v "$PWD:/work" \
            -w /work \
            obolibrary/odkfull:v1.6 \
            bash -lc "make dependencies && make build-release"

      - name: Set release tag
        id: version
        run: echo "tag=v$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        if: success() && hashFiles('doid.owl') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            doid.yaml
            doid.owl
            mirror-doid.owl
            doid.db
            reports/mirror_signature-doid.tsv
            reports/component_signature-doid.tsv
            metadata/doid-metrics.json
            mappings/doid.sssom.tsv
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
